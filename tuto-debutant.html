<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Tuto débutant · Trading forex</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body,input,button{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
a{color:inherit;text-decoration:none}

:root{
  --bg:#0f1117;
  --surface:#1a1d27;
  --surface2:#22263a;
  --surface3:#2a2f45;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.14);
  --text:#e2e8f0;
  --muted:#64748b;
  --muted2:#94a3b8;
  --acc:#10b981;
  --acc-dim:rgba(16,185,129,0.12);
  --acc-dark:#059669;
  --red:#ef4444;
  --red-dim:rgba(239,68,68,0.12);
  --orange:#f97316;
  --orange-dim:rgba(249,115,22,0.18);
  --blue:#3b82f6;
  --blue-dim:rgba(59,130,246,0.12);
  --yellow:#fbbf24;
  --purple:#a78bfa;
}

body{background:var(--bg);color:var(--text);min-height:100vh}

/* ── Topbar ── */
.topbar{
  height:58px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;
  padding:0 20px;
  position:sticky;top:0;z-index:50;
}
.logo{font-weight:800;font-size:1.02rem;color:var(--acc);letter-spacing:-0.01em}
.logo-sub{font-size:0.7rem;font-weight:600;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-left:6px}
.topbar-sep{flex:1}
.btn-back{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:9px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:0.82rem;color:var(--muted2);
  transition:all 0.15s;
}
.btn-back:hover{color:var(--text);border-color:var(--acc)}

/* ── Layout ── */
.layout{
  display:grid;
  grid-template-columns:280px 1fr;
  max-width:1200px;
  margin:0 auto;
  min-height:calc(100vh - 58px);
}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .toc-wrap{position:static;display:none}
  .toc-wrap.mobile-open{display:block;position:fixed;inset:58px 0 0 0;z-index:30;background:var(--bg);overflow-y:auto;padding:20px}
}

/* ── TOC (sommaire) ── */
.toc-wrap{
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:24px 0;
  position:sticky;top:58px;
  height:calc(100vh - 58px);
  overflow-y:auto;
}
.toc-wrap::-webkit-scrollbar{width:6px}
.toc-wrap::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
.toc-title{
  padding:0 22px 14px;
  font-size:0.7rem;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);
}
.toc-module{margin-bottom:6px}
.toc-module-header{
  padding:8px 22px;
  font-size:0.78rem;font-weight:700;
  color:var(--text);
  cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
}
.toc-module-header:hover{background:var(--surface2)}
.toc-module-header::after{content:'▾';font-size:0.7rem;color:var(--muted);transition:transform 0.2s}
.toc-module.collapsed .toc-module-header::after{transform:rotate(-90deg)}
.toc-module.collapsed .toc-chapters{display:none}
.toc-chapters{padding:4px 0}
.toc-chapter{
  display:block;
  padding:7px 22px 7px 38px;
  font-size:0.78rem;color:var(--muted2);
  cursor:pointer;
  border-left:3px solid transparent;
}
.toc-chapter:hover{background:var(--surface2);color:var(--text)}
.toc-chapter.active{
  background:var(--acc-dim);color:var(--acc);
  border-left-color:var(--acc);
  font-weight:600;
}
.toc-chapter::before{
  content:'○';
  display:inline-block;
  margin-right:6px;
  color:var(--surface3);
  font-size:0.75rem;
}
.toc-chapter.read::before{content:'✓';color:var(--acc)}

.global-progress{
  padding:14px 22px 8px;
  border-top:1px solid var(--border);
  margin-top:8px;
}
.global-progress-label{
  display:flex;justify-content:space-between;
  font-size:0.7rem;color:var(--muted);
  margin-bottom:6px;
}
.global-progress-bar{
  height:6px;background:var(--surface2);
  border-radius:3px;overflow:hidden;
}
.global-progress-fill{
  height:100%;background:var(--acc);
  width:0%;transition:width 0.4s;
}

/* ── Quiz ── */
.quiz-block{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:24px;margin-top:32px;
}
.quiz-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:6px;
}
.quiz-header .emoji{font-size:1.4rem}
.quiz-header h3{margin:0;color:var(--acc);font-size:1.05rem}
.quiz-sub{font-size:0.8rem;color:var(--muted2);margin-bottom:18px}
.quiz-question{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.quiz-question:last-of-type{border-bottom:none}
.quiz-q-text{font-size:0.95rem;font-weight:600;margin-bottom:10px;color:var(--text)}
.quiz-options{display:flex;flex-direction:column;gap:6px}
.quiz-option{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:8px;
  background:var(--surface2);
  border:1px solid var(--border);
  font-size:0.86rem;cursor:pointer;
  transition:all 0.15s;
}
.quiz-option:hover{border-color:var(--acc);background:var(--surface3)}
.quiz-option.correct{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.quiz-option.wrong{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.quiz-option.locked{cursor:default;pointer-events:none}
.quiz-option.locked:not(.correct):not(.wrong){opacity:0.4}
.quiz-explanation{
  margin-top:10px;font-size:0.82rem;
  color:var(--muted2);
  padding:8px 12px;
  background:var(--surface2);
  border-left:3px solid var(--acc);
  border-radius:0 6px 6px 0;
  display:none;
}
.quiz-explanation.visible{display:block}
.quiz-score{
  margin-top:14px;padding:14px;
  background:var(--surface2);border-radius:10px;
  text-align:center;
  display:none;
}
.quiz-score.visible{display:block}
.quiz-score .score-value{font-size:1.6rem;font-weight:800;color:var(--acc);margin-bottom:4px}
.quiz-score .score-msg{font-size:0.84rem;color:var(--muted2)}

/* ── Content ── */
.content{
  padding:36px 48px 80px;
  max-width:760px;
  line-height:1.7;
}
@media(max-width:900px){
  .content{padding:24px 20px 60px}
}

.lesson-tag{
  display:inline-block;
  font-size:0.65rem;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--acc);background:var(--acc-dim);
  padding:4px 10px;border-radius:99px;
  margin-bottom:16px;
}
.content h1{
  font-size:1.85rem;letter-spacing:-0.02em;
  margin-bottom:14px;font-weight:800;
}
.content h2{
  font-size:1.2rem;margin:28px 0 12px;
  color:var(--acc);font-weight:700;
}
.content h3{font-size:1.02rem;margin:20px 0 10px;color:var(--text);font-weight:600}
.content p{margin-bottom:14px;color:var(--text);font-size:0.94rem}
.content ul,.content ol{margin:10px 0 14px 24px}
.content li{margin-bottom:6px;color:var(--text);font-size:0.92rem}
.content strong{color:var(--acc);font-weight:700}
.content em{color:var(--muted2);font-style:normal;background:var(--surface2);padding:1px 6px;border-radius:4px;font-size:0.86rem}
.content code{background:var(--surface2);padding:1px 6px;border-radius:4px;font-size:0.86em;color:var(--yellow);font-family:'SF Mono',Consolas,monospace}

.callout{
  background:var(--surface);
  border-left:3px solid var(--acc);
  padding:14px 18px;border-radius:0 10px 10px 0;
  margin:16px 0;font-size:0.88rem;
}
.callout strong{color:var(--acc)}
.callout.warn{border-left-color:var(--orange);background:var(--orange-dim)}
.callout.warn strong{color:var(--orange)}
.callout.danger{border-left-color:var(--red);background:var(--red-dim)}
.callout.danger strong{color:var(--red)}
.callout.info{border-left-color:var(--blue);background:var(--blue-dim)}
.callout.info strong{color:var(--blue)}

table{
  width:100%;border-collapse:collapse;
  margin:14px 0;font-size:0.86rem;
  background:var(--surface);border-radius:8px;
  overflow:hidden;
}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--border)}
th{
  color:var(--muted2);font-weight:700;font-size:0.7rem;
  text-transform:uppercase;letter-spacing:0.05em;
  background:var(--surface2);
}
tr:last-child td{border-bottom:none}

.example-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px 18px;
  margin:16px 0;
}
.example-box-title{
  font-size:0.68rem;font-weight:700;
  text-transform:uppercase;letter-spacing:0.08em;
  color:var(--muted2);margin-bottom:8px;
}

.lesson-nav{
  display:flex;justify-content:space-between;
  margin-top:40px;padding-top:20px;
  border-top:1px solid var(--border);
  gap:12px;
}
.lesson-nav button{
  padding:10px 16px;border-radius:9px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-size:0.84rem;font-weight:500;
  transition:all 0.15s;
  flex:1;text-align:center;
}
.lesson-nav button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.lesson-nav button:disabled{opacity:0.3;cursor:not-allowed}
.lesson-nav .next{background:var(--acc);color:white;border-color:var(--acc)}
.lesson-nav .next:hover:not(:disabled){background:var(--acc-dark)}

/* ── Mobile drawer ── */
.mobile-toc-btn{display:none}
@media(max-width:900px){
  .mobile-toc-btn{
    display:flex;align-items:center;gap:6px;
    padding:7px 14px;border-radius:9px;
    background:var(--surface2);border:1px solid var(--border);
    font-size:0.82rem;color:var(--muted2);
  }
}

/* ── Hero section pour la page d'accueil ── */
.hero{
  text-align:center;
  padding:40px 20px 30px;
  margin-bottom:24px;
  border-bottom:1px solid var(--border);
}
.hero h1{font-size:2.2rem;margin-bottom:10px}
.hero p{color:var(--muted2);font-size:1rem;max-width:560px;margin:0 auto}
.hero-icon{font-size:3rem;margin-bottom:12px;display:block}
.progress-bar{
  height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;
  margin-top:24px;max-width:300px;margin-left:auto;margin-right:auto;
}
.progress-bar-fill{
  height:100%;background:var(--acc);
  width:0%;transition:width 0.3s;
}
.progress-text{
  font-size:0.74rem;color:var(--muted);
  margin-top:8px;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">🎓 Tuto débutant <span class="logo-sub">Forex from scratch</span></div>
  <div class="topbar-sep"></div>
  <button class="mobile-toc-btn" id="mobile-toc-btn">📚 Sommaire</button>
  <a href="./index.html" class="btn-back">← Dashboard</a>
</header>

<div class="layout">

  <aside class="toc-wrap" id="toc-wrap">
    <div class="toc-title">Programme complet</div>
    <div id="toc"></div>
    <div class="global-progress">
      <div class="global-progress-label">
        <span>Progression</span>
        <span id="progress-text">0 / 24</span>
      </div>
      <div class="global-progress-bar"><div class="global-progress-fill" id="progress-fill"></div></div>
    </div>
  </aside>

  <main class="content" id="content"></main>

</div>

<script>
'use strict';

// ============================================================
// MODULES & CHAPITRES
// ============================================================
const MODULES = [
  { id: 'M0', title: '0. Le marché, c\'est quoi vraiment ?', chapters: [
    { id: '0.1', title: 'Qu\'est-ce qu\'un marché financier ?' },
    { id: '0.2', title: 'Les acteurs : qui fait quoi ?' },
    { id: '0.3', title: 'Forex vs Bourse vs Crypto' },
    { id: '0.4', title: 'D\'où viennent les prix ?' },
  ]},
  { id: 'M1', title: '1. Démarrer concrètement', chapters: [
    { id: '1.1', title: 'Le broker, ton intermédiaire' },
    { id: '1.2', title: 'Choisir un bon broker' },
    { id: '1.3', title: 'Compte démo vs compte réel' },
    { id: '1.4', title: 'Combien il faut pour commencer ?' },
  ]},
  { id: 'M2', title: '2. Mécanique d\'un trade', chapters: [
    { id: '2.1', title: 'Acheter / vendre : long et short' },
    { id: '2.2', title: 'Le spread (commission cachée)' },
    { id: '2.3', title: 'Le levier : ami et ennemi' },
    { id: '2.4', title: 'Marge et appel de marge' },
    { id: '2.5', title: 'Commissions, spread, swap' },
  ]},
  { id: 'M3', title: '3. Les types d\'ordres', chapters: [
    { id: '3.1', title: 'Ordre au marché (market)' },
    { id: '3.2', title: 'Ordre limite (limit)' },
    { id: '3.3', title: 'Ordre stop' },
    { id: '3.4', title: 'Stop Loss et Take Profit' },
  ]},
  { id: 'M4', title: '4. Les vrais chiffres et pièges', chapters: [
    { id: '4.1', title: 'La stat qui fait peur (90% perdent)' },
    { id: '4.2', title: 'Les 5 pièges du débutant' },
    { id: '4.3', title: 'Combien de temps en démo ?' },
    { id: '4.4', title: 'Combien gagne un trader vraiment ?' },
  ]},
  { id: 'M5', title: '5. Ton parcours vers le dashboard', chapters: [
    { id: '5.1', title: 'Pourquoi ICT et pas autre chose ?' },
    { id: '5.2', title: 'Comment utiliser le dashboard' },
    { id: '5.3', title: 'Le Paper Trading intégré' },
    { id: '5.4', title: 'Ton chemin étape par étape' },
  ]},
];

const CHAPTERS = {
  // ============= MODULE 0 =============
  '0.1': `
    <span class="lesson-tag">Module 0 · Bases du marché</span>
    <h1>Qu'est-ce qu'un marché financier ?</h1>
    <p>Imagine un <strong>énorme supermarché mondial</strong>, ouvert 24h/24 (du dimanche soir au vendredi soir pour le forex), où des millions de personnes échangent des choses : des devises, des actions d'entreprises, des matières premières (pétrole, or), des cryptomonnaies…</p>
    <p>Ce n'est pas un lieu physique. C'est un <strong>réseau électronique mondial</strong> qui relie banques, hedge funds, entreprises, particuliers. Tout le monde achète et vend à tout le monde, à toute vitesse.</p>
    <h2>Pourquoi ce marché existe ?</h2>
    <ul>
      <li>Une entreprise française qui vend aux USA reçoit des dollars → elle doit les convertir en euros → elle vend ses $ sur le marché forex</li>
      <li>Un investisseur veut placer son argent dans Apple → il achète des actions Apple sur le NASDAQ</li>
      <li>Un raffineur a besoin de pétrole → il achète des contrats sur le marché des matières premières</li>
    </ul>
    <p><strong>Le marché existe pour répondre à ces besoins réels.</strong> Les traders particuliers (toi, moi) viennent en plus, en essayant de profiter des variations de prix.</p>
    <div class="callout">
      <strong>L'image clé.</strong> Quand tu trades, tu n'es pas seul. Tu es un tout petit poisson dans un océan où nagent aussi des baleines (banques centrales, fonds souverains, gros hedge funds). Comprendre comment elles nagent = la clé.
    </div>
  `,
  '0.2': `
    <span class="lesson-tag">Module 0 · Bases du marché</span>
    <h1>Les acteurs : qui fait quoi ?</h1>
    <p>Sur le marché, plusieurs types d'acteurs cohabitent. Comprendre qui fait quoi t'aide à voir <em>pourquoi</em> les prix bougent.</p>
    <table>
      <tr><th>Acteur</th><th>Rôle</th><th>Volume</th></tr>
      <tr><td>🏦 Banques centrales</td><td>Politique monétaire (taux d'intérêt). BCE, Fed, BoE…</td><td>Énorme</td></tr>
      <tr><td>🏛 Banques commerciales</td><td>JP Morgan, Deutsche Bank… Font le marché entre elles.</td><td>40% du forex</td></tr>
      <tr><td>💼 Hedge funds</td><td>Spéculation pure. Bridgewater, Citadel…</td><td>~20%</td></tr>
      <tr><td>🏢 Entreprises</td><td>Conversion de devises pour leurs opérations</td><td>~10%</td></tr>
      <tr><td>👤 Particuliers</td><td>Toi, moi. Via brokers retail.</td><td>~5%</td></tr>
    </table>
    <h2>Smart Money vs Retail</h2>
    <p>Tu vas souvent entendre ces deux termes :</p>
    <ul>
      <li><strong>Smart Money</strong> = banques, hedge funds, "ceux qui savent". Ont accès aux meilleures données, paient des analystes à plein temps.</li>
      <li><strong>Retail</strong> = particuliers. La grande majorité perd. Tradent à l'instinct ou avec des stratégies basiques.</li>
    </ul>
    <p>L'ICT (Inner Circle Trader, la méthode du dashboard) part d'un principe : <strong>au lieu de traders contre le Smart Money, copions-les</strong>. Les zones OB, FVG, killzones que tu vois sur le dashboard sont des <em>signatures</em> des actions Smart Money.</p>
    <div class="callout info">
      <strong>Statistique parlante.</strong> Sur le forex, 80% du volume est fait par seulement 10 acteurs (gros banques). C'est <em>eux</em> qui font les prix. Le retail ne fait que subir.
    </div>
  `,
  '0.3': `
    <span class="lesson-tag">Module 0 · Bases du marché</span>
    <h1>Forex vs Bourse vs Crypto</h1>
    <p>Trois marchés très différents. Comprends les différences avant de choisir.</p>
    <table>
      <tr><th></th><th>Forex</th><th>Bourse (actions)</th><th>Crypto</th></tr>
      <tr><td>Quoi</td><td>Devises (EUR/USD…)</td><td>Parts d'entreprises (Apple…)</td><td>Bitcoin, ETH…</td></tr>
      <tr><td>Horaires</td><td>24h/24 sauf week-end</td><td>9h-17h selon bourse</td><td>24h/24 7j/7</td></tr>
      <tr><td>Volume jour</td><td>7000 milliards $</td><td>~500 milliards $</td><td>~50 milliards $</td></tr>
      <tr><td>Volatilité</td><td>Modérée (0.5-1%/jour)</td><td>Modérée à forte</td><td>Très forte (5-15%/jour)</td></tr>
      <tr><td>Levier dispo</td><td>Jusqu'à 30:1 (EU)</td><td>2-5:1</td><td>10-100:1 (offshore)</td></tr>
      <tr><td>Régulation</td><td>Forte</td><td>Très forte</td><td>Faible</td></tr>
    </table>
    <h2>Pourquoi EUR/USD pour débuter ?</h2>
    <ul>
      <li><strong>Le plus liquide</strong> : tu peux entrer/sortir instantanément, sans glissement</li>
      <li><strong>Spread minuscule</strong> : ~0.5 pip chez un bon broker (vs 5-10 pips sur des paires exotiques)</li>
      <li><strong>Comportement prévisible</strong> : réagit aux nouvelles US/européennes, suit des patterns ICT clairs</li>
      <li><strong>Beaucoup de matériel pédagogique</strong> en français/anglais</li>
    </ul>
    <div class="callout warn">
      <strong>Attention crypto.</strong> Si tu vois des pubs "20 000€ devenus 2M€ avec le Bitcoin en 6 mois" — c'est l'exception, jamais la règle. La crypto est extrêmement volatile et risquée pour un débutant. <em>Commence par le forex, pas la crypto.</em>
    </div>
  `,
  '0.4': `
    <span class="lesson-tag">Module 0 · Bases du marché</span>
    <h1>D'où viennent les prix ?</h1>
    <p>Question fondamentale : <strong>quand EUR/USD est à 1.0850, qui a décidé ça ?</strong></p>
    <h2>La loi de l'offre et de la demande</h2>
    <p>Le prix d'une paire monte quand il y a <strong>plus d'acheteurs que de vendeurs</strong>, et baisse dans le cas inverse. C'est tout.</p>
    <p>Concrètement, à chaque instant :</p>
    <ul>
      <li>Les <strong>acheteurs</strong> proposent un prix max qu'ils veulent payer (le <em>bid</em>)</li>
      <li>Les <strong>vendeurs</strong> proposent un prix min auquel ils veulent vendre (le <em>ask</em>)</li>
      <li>Le <em>spread</em> = la différence entre les deux. Quand ils se rencontrent → trade exécuté → le prix bouge.</li>
    </ul>
    <h2>Qu'est-ce qui fait bouger les prix ?</h2>
    <ol>
      <li><strong>Actualités économiques</strong> : annonces des banques centrales, chômage US, inflation EU, etc.</li>
      <li><strong>Sentiment du marché</strong> : peur, euphorie, incertitude (guerres, crises politiques)</li>
      <li><strong>Flux institutionnels</strong> : quand une banque exécute un gros ordre, le prix bouge — même sans nouvelle. C'est <em>ça</em> que l'ICT traque.</li>
    </ol>
    <h2>Le piège du débutant</h2>

function renderQuiz(chapterId){
  const quiz = QUIZZES[chapterId];
  if(!quiz) return '';
  return `
    <div class="quiz-block">
      <div class="quiz-header">
        <span class="emoji">🧠</span>
        <h3>${quiz.title}</h3>
      </div>
      <p class="quiz-sub">${quiz.after}</p>
      ${quiz.questions.map((q, qi) => `
        <div class="quiz-question" data-q="${qi}">
          <div class="quiz-q-text">${qi + 1}. ${q.q}</div>
          <div class="quiz-options">
            ${q.options.map((opt, oi) => `
              <div class="quiz-option" data-opt="${oi}" data-correct="${oi === q.correct ? '1' : '0'}">${opt}</div>
            `).join('')}
          </div>
          <div class="quiz-explanation"><strong>Explication :</strong> ${q.explain}</div>
        </div>
      `).join('')}
      <div class="quiz-score" id="quiz-score-${chapterId}">
        <div class="score-value">— / ${quiz.questions.length}</div>
        <div class="score-msg"></div>
      </div>
    </div>
  `;
}

function wireQuiz(chapterId){
  const quiz = QUIZZES[chapterId];
  if(!quiz) return;
  const block = document.querySelector('.quiz-block');
  if(!block) return;
  const answered = new Set();
  block.querySelectorAll('.quiz-question').forEach((qEl, qi) => {
    const opts = qEl.querySelectorAll('.quiz-option');
    opts.forEach(opt => {
      opt.addEventListener('click', () => {
        if(answered.has(qi)) return;
        answered.add(qi);
        const correctOptIdx = quiz.questions[qi].correct;
        opts.forEach((o, oi) => {
          o.classList.add('locked');
          if(oi === correctOptIdx) o.classList.add('correct');
          else if(o === opt) o.classList.add('wrong');
        });
        qEl.querySelector('.quiz-explanation').classList.add('visible');
        if(answered.size === quiz.questions.length){
          const correct = [...block.querySelectorAll('.quiz-question')].filter((qEl, i) => {
            const sel = qEl.querySelector('.quiz-option.correct.wrong, .quiz-option.correct:not(.wrong)');
            // Si l'utilisateur a cliqué sur le bon : la correct n'a pas .wrong
            return qEl.querySelector('.quiz-option.correct') && !qEl.querySelector('.quiz-option.wrong');
          }).length;
          const score = document.getElementById('quiz-score-' + chapterId);
          score.classList.add('visible');
          score.querySelector('.score-value').textContent = `${correct} / ${quiz.questions.length}`;
          const pct = correct / quiz.questions.length;
          const msg = pct === 1 ? '🎉 Parfait ! Tu as tout compris.'
            : pct >= 0.66 ? '👍 Bien ! Re-lis les explications pour les questions ratées.'
            : '📚 Re-lis le module avant de continuer — c\'est important.';
          score.querySelector('.score-msg').textContent = msg;
          // Save quiz score
          localStorage.setItem('quiz_' + chapterId, correct);
        }
      });
    });
  });
}

// ============================================================
// RENDU + PROGRESS
// ============================================================
const LS_KEY = 'tuto_last_chapter';
const READ_KEY = 'tuto_read_chapters';
let currentChapter = localStorage.getItem(LS_KEY) || '0.1';
let readChapters = new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));

function renderTOC(){
  const container = document.getElementById('toc');
  container.innerHTML = MODULES.map((m, mi) => `
    <div class="toc-module ${mi === 0 ? '' : 'collapsed'}" data-mod="${m.id}">
      <button class="toc-module-header">${m.title}</button>
      <div class="toc-chapters">
        ${m.chapters.map(c => `
          <a class="toc-chapter ${c.id === currentChapter ? 'active' : ''} ${readChapters.has(c.id) ? 'read' : ''}" data-chap="${c.id}">${c.title}</a>
        `).join('')}
      </div>
    </div>
  `).join('');
  container.querySelectorAll('.toc-module-header').forEach(h => {
    h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
  });
  container.querySelectorAll('.toc-chapter').forEach(a => {
    a.addEventListener('click', () => loadChapter(a.dataset.chap));
  });
  updateProgress();
}

function markRead(chapterId){
  if(readChapters.has(chapterId)) return;
  readChapters.add(chapterId);
  localStorage.setItem(READ_KEY, JSON.stringify([...readChapters]));
  const tocLink = document.querySelector(`.toc-chapter[data-chap="${chapterId}"]`);
  if(tocLink) tocLink.classList.add('read');
  updateProgress();
}

function updateProgress(){
  const all = MODULES.flatMap(m => m.chapters.map(c => c.id));
  const read = all.filter(id => readChapters.has(id)).length;
  const fill = document.getElementById('progress-fill');
  const text = document.getElementById('progress-text');
  if(fill) fill.style.width = (read / all.length * 100) + '%';
  if(text) text.textContent = `${read} / ${all.length}`;
}

function loadChapter(id){
  currentChapter = id;
  localStorage.setItem(LS_KEY, id);
  const content = CHAPTERS[id] || '<p>Chapitre à venir.</p>';
  const quizHtml = renderQuiz(id);
  const all = MODULES.flatMap(m => m.chapters.map(c => c.id));
  const idx = all.indexOf(id);
  const prev = idx > 0 ? all[idx - 1] : null;
  const next = idx < all.length - 1 ? all[idx + 1] : null;

  const progress = ((idx + 1) / all.length) * 100;

  document.getElementById('content').innerHTML = content + quizHtml + `
    <div class="progress-bar"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
    <div class="progress-text" style="text-align:center">Chapitre ${idx + 1} / ${all.length}</div>
    <div class="lesson-nav">
      <button ${!prev ? 'disabled' : ''} data-chap="${prev || ''}">← Précédent</button>
      <button class="next" ${!next ? 'disabled' : ''} data-chap="${next || ''}">${next ? 'Suivant →' : '🎓 Fin du tuto'}</button>
    </div>
  `;
  document.querySelectorAll('.toc-chapter').forEach(a => {
    a.classList.toggle('active', a.dataset.chap === id);
  });
  document.querySelectorAll('.lesson-nav button').forEach(b => {
    if(b.dataset.chap) b.addEventListener('click', () => loadChapter(b.dataset.chap));
  });
  // Wire quiz if present
  if(quizHtml) wireQuiz(id);
  // Mark as read after 4s (le temps de lire vraiment)
  setTimeout(() => markRead(id), 4000);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('toc-wrap').classList.remove('mobile-open');
}

// Mobile toc toggle
document.getElementById('mobile-toc-btn').addEventListener('click', () => {
  document.getElementById('toc-wrap').classList.toggle('mobile-open');
});

// Boot
renderTOC();
loadChapter(currentChapter);
</script>
