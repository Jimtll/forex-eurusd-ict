<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f1117" rx="96"/>
  <!-- Grid lines subtle -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="64" y1="160" x2="448" y2="160"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="352" x2="448" y2="352"/>
  </g>
  <!-- Candles -->
  <!-- bearish 1 -->
  <line x1="100" y1="120" x2="100" y2="200" stroke="#ef4444" stroke-width="4"/>
  <rect x="86" y="140" width="28" height="50" fill="#ef4444"/>
  <!-- bullish 1 -->
  <line x1="150" y1="100" x2="150" y2="240" stroke="#10b981" stroke-width="4"/>
  <rect x="136" y="130" width="28" height="100" fill="#10b981"/>
  <!-- bearish 2 -->
  <line x1="200" y1="150" x2="200" y2="280" stroke="#ef4444" stroke-width="4"/>
  <rect x="186" y="180" width="28" height="80" fill="#ef4444"/>
  <!-- bullish 2 big -->
  <line x1="250" y1="180" x2="250" y2="380" stroke="#10b981" stroke-width="4"/>
  <rect x="236" y="220" width="28" height="140" fill="#10b981"/>
  <!-- bullish 3 -->
  <line x1="300" y1="200" x2="300" y2="350" stroke="#10b981" stroke-width="4"/>
  <rect x="286" y="220" width="28" height="120" fill="#10b981"/>
  <!-- bearish 3 -->
  <line x1="350" y1="240" x2="350" y2="340" stroke="#ef4444" stroke-width="4"/>
  <rect x="336" y="260" width="28" height="60" fill="#ef4444"/>
  <!-- bullish 4 big with glow -->
  <line x1="400" y1="180" x2="400" y2="420" stroke="#10b981" stroke-width="4"/>
  <rect x="386" y="220" width="28" height="180" fill="#10b981"/>
  <!-- ICT brand -->
  <text x="256" y="470" font-family="-apple-system, system-ui, sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#10b981" letter-spacing="2">ICT</text>
</svg>
